
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Global Talent Bridge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#17233d;font-family:Arial,sans-serif}
header{background:#101d35;color:white;padding:20px;text-align:center;font-size:20px;font-weight:bold}
main{max-width:650px;margin:35px auto;padding:25px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 5px 25px #14213a12}
h1{font-size:27px;margin-top:0}
p{color:#64748b;line-height:1.6}
label{display:block;font-weight:bold;margin:17px 0 7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd5e2;border-radius:8px;font-size:16px;background:white}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:9px;padding:13px 18px;font-weight:bold;cursor:pointer}
.lang{background:#263b5c;color:white}
.submit{background:#173f70;color:white;width:100%;margin-top:22px;font-size:16px}
.note{font-size:13px;background:#eef4fb;padding:12px;border-radius:8px;margin-top:18px}
</style>
</head>
<body>
<header>🌍 Global Talent Bridge</header>
<main>
<div class="card">
<button class="lang" onclick="toggleLanguage()">العربية / EN</button>
<h1 data-en="Create your talent profile" data-ar="أنشئ ملفك الشخصي للمواهب">Create your talent profile</h1>
<p data-en="Everyone has potential. Tell us about yourself, your abilities and the opportunities you are looking for."
data-ar="كل إنسان لديه قدرات. عرّفنا بنفسك وبمهاراتك والفرص التي تبحث عنها.">
Everyone has potential. Tell us about yourself, your abilities and the opportunities you are looking for.
</p>

<form id="profile">
<label data-en="Full name" data-ar="الاسم الكامل">Full name</label>
<input required maxlength="80" placeholder="Your name">

<label data-en="Country" data-ar="البلد">Country</label>
<input required maxlength="60" placeholder="Your country">

<label data-en="Education level" data-ar="المستوى التعليمي">Education level</label>
<select>
<option data-en="Select your level" data-ar="اختر مستواك">Select your level</option>
<option data-en="No formal education" data-ar="بدون تعليم رسمي">No formal education</option>
<option data-en="Primary school" data-ar="ابتدائي">Primary school</option>
<option data-en="Middle school" data-ar="متوسط">Middle school</option>
<option data-en="Secondary school" data-ar="ثانوي">Secondary school</option>
<option data-en="Vocational training" data-ar="تكوين مهني">Vocational training</option>
<option data-en="University" data-ar="جامعي">University</option>
<option data-en="Other" data-ar="أخرى">Other</option>
</select>

<label data-en="Your skills" data-ar="مهاراتك">Your skills</label>
<textarea maxlength="1000" placeholder="What can you do?"></textarea>

<label data-en="What opportunities interest you?" data-ar="ما نوع الفرص التي تهمك؟">What opportunities interest you?</label>
<select>
<option data-en="Choose an opportunity" data-ar="اختر نوع الفرصة">Choose an opportunity</option>
<option data-en="Employment" data-ar="العمل والتوظيف">Employment</option>
<option data-en="Education and scholarships" data-ar="التعليم والمنح">Education and scholarships</option>
<option data-en="Mentorship" data-ar="التوجيه والإرشاد">Mentorship</option>
<option data-en="Projects and innovation" data-ar="المشاريع والابتكار">Projects and innovation</option>
<option data-en="All opportunities" data-ar="كل الفرص">All opportunities</option>
</select>

<label data-en="Tell us about yourself (optional)" data-ar="عرّفنا بنفسك (اختياري)">Tell us about yourself (optional)</label>
<textarea maxlength="1500" placeholder="Your interests, experience or ideas..."></textarea>

<div class="note" data-en="This is a prototype. Your information is not sent or saved. Do not enter private contact details yet."
data-ar="هذه نسخة تجريبية. معلوماتك لا تُرسل ولا تُحفظ. لا تدخل بيانات اتصال خاصة حالياً.">
This is a prototype. Your information is not sent or saved. Do not enter private contact details yet.
</div>
<button class="submit" type="submit" data-en="Preview my profile" data-ar="معاينة ملفي">Preview my profile</button>
</form>
</div>
</main>
<script>
let language='en';
function toggleLanguage(){
language=language==='en'?'ar':'en';
document.documentElement.lang=language;
document.documentElement.dir=language==='ar'?'rtl':'ltr';
document.querySelectorAll('[data-en]').forEach(el=>{
el.textContent=el.getAttribute('data-'+language);
});
}
document.getElementById('profile').addEventListener('submit',function(e){
e.preventDefault();
alert(language==='en'?'This is only a preview. Registration and secure saving will be added in a later version.':'هذه معاينة فقط. سنضيف التسجيل والحفظ الآمن في مرحلة لاحقة.');
});
</script>
</body>
</html>
